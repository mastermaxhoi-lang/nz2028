 {"src": "foto/temata.jpg", "credit": "temata.co.nz", "page": "https://www.temata.co.nz"}, "why": "Coleraine 1998 единственное вино НЗ, которое Decanter включил в рубрику Wine Legend (2017). В рейтинге The Real Review Top Wineries of NZ: 7-е место в 2025 и 10-е в 2026. Сами пишут «Established in 1896», но старейшей винодельней страны это их не делает: Mission Estate старше (1851), формула Te Mata осторожнее: «старейшая на исходном участке и винограднике».", "wines": "Coleraine (бордоский бленд, с 1982), Awatea, Bullnose, Elston, Alma, Cape Crest (это все вина линейки Showcase)", "visit": "Лето (по странице дегустаций 1 сен - 31 мар): пн-сб 10:00-17:00 (последняя дегустация 16:15), вс 11:00-16:00. Среда открыта. Discovery Tasting NZ$25 (5 вин, 45 мин, 1-4 чел., группы до 8 через почту, не платите при покупке 2 бутылок). Showcase Tasting NZ$75 (6 вин, 1 ч, пн-пт в 11:00, запись обязательна, 2-10 чел., в FAQ максимум 16). Heritage Experience NZ$150 (прогулка по винограднику, винодельня, мастер-класс, 2 ч, пн-пт в 14:00, 2-8 чел.). Winery Tour NZ$25 (пн-пт в 12:00, 1-8 чел.). Группы больше 16 не принимают. Запись онлайн на temata.co.nz/tasting, тел. +64 6 877 4399.", "approx": ""}, {"name": "Trinity Hill", "lat": -39.6146, "lon": 176.7338, "region": "Хокс-Бей", "site": "https://trinityhill.com", "tier": "хорошо", "tierColor": "#6a8d45", "status": "plan", "plan": "День 7, ср 05.01 (только 19 дн)", "origin": "Сам", "somm": "", "rating": "Real Review 2026: вне топ-50\nReal Review 2025: вне топ-50", "photo": {"src": "foto/trinityhill.jpg", "credit": "trinityhill.com", "page": "https://trinityhill.com"}, "why": "Homage Syrah считается одним из эталонных сир НЗ. Основатель Джон Хэнкок работал урожай 1996 у Jaboulet в Тен-л'Эрмитаже, Жерар Жабуле потом подарил ему 3 клона сиры и 1 вионье из аппелласьона Эрмитаж, их посадили в 2002. Шеф-винодел здесь Warren Gibson, он же делает Bilancia, так что это ближайший доступный способ увидеть его почерк.", "wines": "Homage Syrah, Gimblett Gravels Syrah", "visit": "На сайте два варианта часов: «Open 7 days, 11am-5pm» и в подвале страницы «Wed-Sun, 11am-5pm»; среда открыта в обоих. Последняя дегустация 16:30. Запись «strongly encouraged»: trinityhill.com/bookings, cellardoor@trinityhill.com, +64 6 879 7778. Дегустационный зал в бывшем бочечном зале с потолками 5 м. Есть тарелки с местными продуктами.", "approx": ""}, {"name": "Bilancia", "lat": -39.6115, "lon": 176.7294, "region": "Хокс-Бей", "site": "https://www.bilancia.co.nz", "tier": "очень ценно", "tierColor": "#c0703a", "status": "ours", "plan": "Нет", "origin": "Совет", "somm": "", "rating": "Real Review 2026: №4\nReal Review 2025: №23", "photo": {"src": "foto/bilancia.jpg", "credit": "bilancia.co.nz", "page": "https://www.bilancia.co.nz"}, "why": "4-е место в рейтинге The Real Review Top Wineries of New Zealand 2026, выше всех хозяйств Хокс-Бея (Te Mata 10-я, Craggy 24-я). Кен Гарджетт (Quill & Pad, 2024) называет la collina одной из трёх по-настоящему выдающихся сир НЗ и «world class», ставил 2020 и 2021 по 98/100. Крошечный объём: la collina не делали в 2011, 2012, 2017, 2022 и 2023.", "wines": "la collina Syrah (флагман, около NZ$160-170), Trelinnoe Syrah, Tiratore Chardonnay, Uvaggio (бленд марсан, руссан, вионье), Hawke's Bay Syrah и Chardonnay (вход в марку, около NZ$37-40)", "visit": "Дегустационной нет. Официальный сайт: «We do not have a Cellar Door for tastings». Агрегатор En Primeur Club пишет «Appointment only» и «No public tastings», официального подтверждения визитов по записи не нашёл. Делают вино Warren Gibson и Lorraine Leheny (подтверждено сайтом), первый урожай 1997, урожай 2026 стал 30-м. Связь: wine@bilancia.co.nz, +64 6 844 4301, адрес только почтовый (PO Box 2508, Hastings). Шанс есть только как личная просьба на 2-4 человек через почту, не группой 6-12.\nГде ещё попробовать: 1) Black Barn Bistro, 34 Black Barn Road, Havelock North (около 600 м по прямой от Te Mata, координаты -39.6736, 176.9100 по Nominatim): в винной карте октября 2025 есть Bilancia Hawkes Bay Syrah 2022 за NZ$105 бутылка и из библиотеки Bilancia Uvaggio Viognier 2020 за NZ$220. Часы бистро в среду не нашёл, тел. +64 6 877 7985. 2) Advintage Wines, 4 Donnelly Street, Havelock North (магазин): на сайте Bilancia Chardonnay 2024 NZ$38.99, Syrah 2025 NZ$39.99, Trelinnoe Syrah 2020 NZ$109.99, Uvaggio 2020 NZ$94.99, Tiratore Chardonnay 2021 NZ$84.99; наличие в зале не подтверждено, la collina в поиске нет. Часы пн-пт 10:00-17:30, сб 10:00-17:00, вс закрыто, 1.01 и 2.01 закрыто. В среду 05.01 открыт. 3) Вне региона: ресторан Esther в QT Auckland, где Bilancia «cornerstone of the wine list» (Dish, май 2025), удобно в первые дни в Окленде. la collina 2024 в рознице: Fine Wine Delivery NZ$169.99 (на 28.10 нет в наличии), Glengarry, Normanby (Окленд и Веллингтон, Syrah 2025 NZ$36.99). Винные карты Craggy Range, Malo, Bistronomy/Vinotech на Bilancia не проверены.", "approx": "точка приблизительная: из карточки En Primeur Club, адреса для гостей нет"}, {"name": "Smith & Sheth (Oenothèque и Wine Lounge)", "lat": -39.6702, "lon": 176.8764, "region": "Хокс-Бей", "site": "https://www.smithandsheth.com", "tier": "очень ценно", "tierColor": "#c0703a", "status": "new", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №31\nReal Review 2025: №20", "photo": {"src": "foto/smithsheth.jpg", "credit": "smithandsheth.com", "page": "https://www.smithandsheth.com"}, "why": "Хозяева Стив Смит MW (сооснователь Craggy Range, руководил им 16 лет) и Брайан Шет; им же принадлежит Pyramid Valley (12-е место The Real Review 2026), и в одном зале можно сравнить их вина Хокс-Бея с Pyramid Valley из Северного Кентербери, куда группа не доедет. Smith & Sheth 31-е место The Real Review 2026. Открыто до 21:00, в 5 минутах от Te Mata.", "wines": "CRU (сортовые вина по регионам) и Lieux-Dits (одиночные участки Хокс-Бея); рядом Pyramid Valley Colours и Pastures", "visit": "Вт-сб 12:00-21:00, среда открыта. Дегустационные сеты: Lieux-Dits NZ$45 (5 вин с 3 участков в 3 субрегионах), Meet the Family NZ$35 (8 вин, пары CRU против Pyramid Valley), Trust Us NZ$25 (6 вин на выбор команды), Snapshot NZ$15 (3 вина). Сеты бесплатны при покупке 2-3 бутылок. Группа больше 8 человек только через bookings@smithandsheth.com или +64 6 650 5550. Отдельно Vineyard & Studio Experience: NZ$2400 на 2-4 гостей, 5,5-6 ч, вт-сб, забирают в 10:30, виноградник Omahu, обед, приватная дегустация; для группы цена по запросу.", "approx": ""}, {"name": "Easthope", "lat": -39.5858, "lon": 176.5297, "region": "Хокс-Бей", "site": "https://www.easthope.co.nz", "tier": "хорошо", "tierColor": "#6a8d45", "status": "new", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №36\nReal Review 2025: вне топ-50", "photo": {"src": "foto/easthope.jpg", "credit": "easthope.co.nz", "page": "https://www.easthope.co.nz"}, "why": "36-е место The Real Review 2026. Paddock Six Syrah 2020 получил 97/100 у Боба Кэмпбелла MW (по сайту хозяйства), выпущено 650 бутылок. Камерная дегустация по записи, как раз формат для 2-3 знатоков.", "wines": "'Paddock Six' Syrah, 'Frank's Selection' Syrah, Home Block Chardonnay и Syrah", "visit": "Только по записи, «limited availability throughout the week». NZ$50 с человека, засчитывается при покупке 6+ бутылок в день визита. Запись через форму на easthope.co.nz/tasting-room. Лимит группы не указан. От Напиера 48 км, около 42 мин (OSRM).", "approx": ""}, {"name": "Tony Bish Wines (The Urban Winery)", "lat": -39.483, "lon": 176.896, "region": "Хокс-Бей", "site": "https://tonybishwines.co.nz", "tier": "хорошо", "tierColor": "#6a8d45", "status": "new", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №32\nReal Review 2025: вне топ-50", "photo": {"src": "foto/tonybish.jpg", "credit": "tonybishwines.co.nz", "page": "https://tonybishwines.co.nz"}, "why": "32-е место The Real Review 2026. Хозяйство целиком про шардоне Хокс-Бея (основано в 2013 Тони и Каррин Биш), ферментация в «яйцах», чанах и бочках. Городская винодельня в арт-деко здании в Напиере, где мы ночуем.", "wines": "Skeetfield Chardonnay (одиночный участок, старые лозы клона Мендоса), Heartwood, Golden Egg, Fat & Sassy, The Family", "visit": "Walk-in четверг-воскресенье. В среду закрыто. Дегустации: Oak Concrete and Sass NZ$15 (4 шардоне), Six Shades of Chardonnay NZ$25 (6 шардоне, включая 2 с одиночных участков). Запись кнопкой Book Tasting на сайте; про группы на странице нет, есть аренда под события. Hawke's Bay Tourism упоминает «By appointment only», но неясно к чему.", "approx": ""}, {"name": "Elephant Hill", "lat": -39.6232, "lon": 176.9614, "region": "Хокс-Бей", "site": "https://www.elephanthill.co.nz", "tier": "можно пропустить", "tierColor": "#9a9a9a", "status": "new", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №30\nReal Review 2025: №18", "photo": {"src": "foto/elephanthill.jpg", "credit": "elephanthill.co.nz", "page": "https://www.elephanthill.co.nz"}, "why": "30-е место The Real Review 2026, архитектурная винодельня у моря. Сейчас ресторан на паузе, а весь бизнес выставлен на продажу, поэтому к январю 2028 формат может измениться.", "wines": "Линейки Icon, Limited Edition, Reserve, Estate (конкретные названия на сайте не проверены)", "visit": "На странице визита: «OPEN FRIDAY - SUNDAY 11am-5pm (winter hours)», то есть в среду закрыто; приватная дегустация в закрытые дни через lee@elephanthill.co.nz. Ресторан: «We're open for wine tastings only for now». Дегустации: без гида 4 вина NZ$20 или 6 вин NZ$30, с гидом NZ$35 (не платите при покупке 2 бутылок). Запись рекомендуется: сайт, +64 6 872 6060, cellardoor@elephanthill.co.nz. Летние часы на сайте не указаны, сторонние листинги расходятся (чт-пн или пт-вс).", "approx": ""}, {"name": "Mission Estate", "lat": -39.5189, "lon": 176.8444, "region": "Хокс-Бей", "site": "https://missionestate.co.nz", "tier": "можно пропустить", "tierColor": "#9a9a9a", "status": "new", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: вне топ-50\nReal Review 2025: вне топ-50", "photo": {"src": "foto/mission.jpg", "credit": "missionestate.co.nz", "page": "https://missionestate.co.nz"}, "why": "История, а не вино: по Te Ara (национальная энциклопедия НЗ) Mission Estate старейший из сохранившихся винодельческих домов страны, основан маристами в Хокс-Бее в 1851. Первые лозы НЗ при этом сажал Сэмюэл Марсден в Керикери в 1819. В рейтингах The Real Review 2026 его нет.", "wines": "Не проверял", "visit": "По Hawke's Bay Tourism: пн 10:00-17:00, вт 12:00-17:00, ср-сб 10:00-17:00, вс 10:00-16:30 (не сказано, что это именно cellar door). Цена дегустации официально не указана. При винодельне ресторан, часы не нашёл. От центра Напиера 8 км, около 10 мин (OSRM).", "approx": ""}, {"name": "Millton Vineyards (Гисборн)", "lat": -38.6764, "lon": 177.897, "region": "Гисборн", "site": "https://www.millton.co.nz", "tier": "можно пропустить", "tierColor": "#9a9a9a", "status": "new", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: вне топ-50\nReal Review 2025: вне топ-50", "photo": null, "why": "Первый в Южном полушарии производитель с органической сертификацией BioGro и второй с биодинамической Demeter (по выдаче поиска). Для знатока интересен, но от Напиера 204 км, около 2 ч 45 мин по OSRM, на деле ближе к 3 ч (оценка: горная SH2), то есть целый день ради одного хозяйства.", "wines": "Не проверял", "visit": "Только будни: пн-пт 10:00-17:00 по одним листингам, 11:00-17:00 по nzwine.com; En Primeur Club пишет «by appointment». Официальный сайт при проверке не открылся (404).", "approx": ""}, {"name": "Ata Rangi", "lat": -41.2159, "lon": 175.468, "region": "Мартинборо и Вайрарапа", "site": "https://www.atarangi.co.nz", "tier": "обязательно", "tierColor": "#7b1e2b", "status": "ours", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №25\nReal Review 2025: №9\nWorld's Best Vineyards 2025: №100", "photo": {"src": "foto/atarangi.jpg", "credit": "atarangi.co.nz", "page": "https://www.atarangi.co.nz"}, "why": "Основано в 1980 году (официальный сайт), домашние виноградники органические с 2014. The Real Review: №9 в рейтинге лучших виноделен НЗ 2025 и №25 в рейтинге 2026. Из трёх культовых имён региона (Ata Rangi, Dry River, Kusuda) это единственное, куда можно просто приехать.", "wines": "Ata Rangi Pinot Noir\nMcCrone Pinot Noir\nMasters Pinot Noir\nOld Vine Abel Pinot Noir\nKotinga Pinot Noir\nMasters Chardonnay\nPotiki Chardonnay\nCelebre\nCrimson Pinot Noir", "visit": "Винный магазин с дегустацией: каждый день 10:00-16:00, без записи, NZ$15 с человека (возвращают при покупке), рассчитан на группы до 6 человек. Гидовая дегустация в Wine Room: только в 11:00, пн-сб, а с 1 ноября каждый день; NZ$25 с человека (бесплатно при покупке), запись обязательна, максимум 6 человек. Запись: visit@atarangi.co.nz или +64 6 306 9570 доб. 1. Для группы 12 человек реальный вариант: 6 на гидовую в 11:00 и 6 параллельно в магазине (это наш вывод из правил, у хозяйства не спрашивали).", "approx": ""}, {"name": "Poppies Martinborough", "lat": -41.2177, "lon": 175.4769, "region": "Мартинборо и Вайрарапа", "site": "https://www.poppiesmartinborough.co.nz", "tier": "очень ценно", "tierColor": "#c0703a", "status": "new", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №19\nReal Review 2025: вне топ-50", "photo": {"src": "foto/poppiesmartinborough.jpg", "credit": "poppiesmartinborough.co.nz", "page": "https://www.poppiesmartinborough.co.nz"}, "why": "Молодое хозяйство (2012, своя винодельня с 2016), которое за несколько лет поднялось на №19 в рейтинге The Real Review 2026, выше Ata Rangi (№25). Хозяйство пишет, что его вина намеренно трудно найти вне своей дегустационной.", "wines": "L'Elu Pinot Noir\nPoppies Pinot Noir\nPoppies Syrah\nPoppies Rosé", "visit": "Каждый день 11:00-16:00. Дегустация без записи, NZ$15 с человека (возвращают при покупке), проводит сотрудник, иногда сама винодел. Обед с тарелками закусок и вином бокалами: только по записи через сайт. Группам от 10 человек просят написать заранее: brent@poppiesmartinborough.co.nz или +64 6 306 8473.", "approx": ""}, {"name": "Escarpment", "lat": -41.2585, "lon": 175.4859, "region": "Мартинборо и Вайрарапа", "site": "https://escarpment.co.nz", "tier": "хорошо", "tierColor": "#6a8d45", "status": "new", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №42\nReal Review 2025: вне топ-50", "photo": {"src": "foto/escarpment.jpg", "credit": "escarpment.co.nz", "page": "https://escarpment.co.nz/pages/visit"}, "why": "Четыре однодворовых пино (Kupe, Kiwa, Te Rehua, Pahi), названных по виноградникам, а не по сорту: удобный способ показать группе, как меняется пино от участка к участку. Основано в 1999 (Wine Companion). The Real Review 2026: №42.", "wines": "Kupe Pinot Noir\nKiwa Pinot Noir\nTe Rehua Pinot Noir\nPahi Pinot Noir\nEscarpment Chardonnay\nPinot Blanc", "visit": "Дегустация с экскурсией 40-50 минут, NZ$15 с человека (не берут при покупке вина). На сайте две версии часов: (1) пн-чт одна дегустация в 11:00 только по записи, пт-сб каждый час 10:00-15:00, запись желательна; (2) вт-пт одна в 11:00, запись обязательна, сб каждый час 11:00-15:00. Воскресенье ни в одной версии не указано. Онлайн-запись escarpment.co.nz/products/appointment не позже чем за 24 часа; в тот же день звонить +64 6 306 8305. Лимит группы не указан.", "approx": ""}, {"name": "Schubert Wines", "lat": -41.2132, "lon": 175.4668, "region": "Мартинборо и Вайрарапа", "site": "https://www.schubert.co.nz", "tier": "хорошо", "tierColor": "#6a8d45", "status": "new", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №37\nReal Review 2025: вне топ-50", "photo": {"src": "foto/schubert.jpg", "credit": "schubert.co.nz", "page": "https://www.schubert.co.nz"}, "why": "Основано в 1998 году выпускниками Гайзенхайма, которые искали место под пино нуар (официальный сайт). Block B Pinot Noir 2006 получил 5 звёзд в панельной дегустации Decanter 2008 (154 пино НЗ, пять звёзд у семи вин). The Real Review 2026: №37.", "wines": "Block B Pinot Noir\nMarion's Vineyard Pinot Noir\nSyrah\nCon Brio", "visit": "На сайте сейчас висят зимние часы: пн-чт только по записи, пт-вс 11:00-15:00; там же «открыто почти каждый день 11:00-15:00». Полная дегустация NZ$15 (не берут при покупке бутылки), ведёт сотрудник. Для групп от 6 человек запись обязательна. Запись: tastingroom@schubert.co.nz, +64 6 306 8505. Вход с Huangarua Road.", "approx": ""}, {"name": "Cloudy Bay", "lat": -41.4913, "lon": 173.8772, "region": "Мальборо", "site": "https://www.cloudybay.com", "tier": "обязательно", "tierColor": "#7b1e2b", "status": "new", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №27\nReal Review 2025: №21\nWorld's Best Vineyards 2025: №26", "photo": {"src": "foto/cloudybay.jpg", "credit": "cloudybay.com", "page": "https://www.cloudybay.com"}, "why": "Первое имя, которое знает группа; первый урожай 1985 (NZ Wine). World's 50 Best Vineyards 2025: 26 место и звание лучшего виноградника Австралазии, единственное хозяйство Мальборо в первой полусотне. The Real Review 2026: 27 место, Pelorus Vintage 2013 лучшее игристое года.", "wines": "Sauvignon Blanc\nTe Koko (название по памяти, на страницах визита не видел)\nChardonnay\nPinot Noir\nPelorus Vintage", "visit": "Каждый день 10:00–17:00, бронь рекомендуют (онлайн через SevenRooms на сайте). Цену обычной дегустации на сайте не нашёл; в выдаче поиска меню 2026 года с тремя дегустациями (Indulge, Experience, Cellar Door Exclusive) по NZ$30, 35 и 45, какая сколько стоит, не проверил. Tailor-Made Tasting: до 8 вин, включая старые урожаи и бокалы вслепую, NZ$250 с человека, 2–18 человек, 10:00–11:30 или по запросу. First Taste Tour 9:30–12:30: NZ$530 за двоих и NZ$70 за каждого следующего, 2–5 человек. Ресторан Saku: обед ежедневно 11–15, ужин чт–пт 17–20, группам больше 6 писать saku@restaurantsasa.co.nz. cellar.door@cloudybay.co.nz, +64 3 520 9147.", "approx": ""}, {"name": "Framingham", "lat": -41.4954, "lon": 173.815, "region": "Мальборо", "site": "https://framingham.co.nz", "tier": "обязательно", "tierColor": "#7b1e2b", "status": "new", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №15\nReal Review 2025: №4", "photo": {"src": "foto/framingham.jpg", "credit": "framingham.co.nz", "page": "https://framingham.co.nz"}, "why": "4 место среди хозяйств НЗ в The Real Review 2025 и 15 место в 2026. Специалист по рислингу: первые лозы в 1981, по их словам одни из самых старых рислингов Мальборо. На сайте цитаты Jancis Robinson (2009) «лучший производитель рислинга НЗ» и Bob Campbell MW (2011) «лучший производитель сладких вин НЗ».", "wines": "Riesling (Framingham Range, разные стили)\nсладкие рислинги\nF-Series range\nSauvignon Blanc\nPinot Noir", "visit": "Каждый день 10:30–16:30, последняя дегустация в 16:00, вино бокалами до 16:15. Дегустация совиньона, пино и рислингов, больше получаса. Цену на сайте не нашёл. Группам больше 6 связаться с дегустационной заранее: info@framingham.co.nz, +64 3 572 8884.", "approx": ""}, {"name": "Te Whare Ra (TWR)", "lat": -41.5117, "lon": 173.8162, "region": "Мальборо", "site": "https://www.twrwines.co.nz", "tier": "обязательно", "tierColor": "#7b1e2b", "status": "ours", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №7\nReal Review 2025: №3", "photo": {"src": "foto/tewharera.jpg", "credit": "twrwines.co.nz", "page": "https://www.twrwines.co.nz"}, "why": "Лучшее хозяйство Мальборо в рейтинге The Real Review два года подряд: 3 место в НЗ в 2025 и 7 место в 2026. Работает с 1979 года, по их описанию в NZ Wine и Marlborough NZ здесь самые старые лозы региона. Органика BioGro, семейное хозяйство Флауэрдэй.", "wines": "SV Toru (field blend)\nSV Riesling D\nSV Riesling M\nSV Syrah", "visit": "Сезон дегустаций 03.11.2026–26.02.2027, только будни, выходные и праздники закрыто. Сессии в 11:00, 14:00 и 15:00, около 45 минут, 5–7 вин, NZ$20 с человека. Запись по телефону +64 3 572 8581 или admin@twrwines.co.nz, мест в сессии мало, без записи могут не посадить. Частные туры и дегустации для групп по запросу, цена зависит от размера группы. NZ Wine даёт другие слоты (11, 12 и 14), верить офсайту.", "approx": ""}, {"name": "Clos Henri", "lat": -41.5242, "lon": 173.7581, "region": "Мальборо", "site": "https://www.closhenri.com", "tier": "очень ценно", "tierColor": "#c0703a", "status": "ours", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №43\nReal Review 2025: №49", "photo": {"src": "foto/closhenri.jpg", "credit": "closhenri.com", "page": "https://www.closhenri.com"}, "why": "Хозяйство семьи Буржуа (Henri Bourgeois) из Сансера, основано в 2000 году. Дегустационная в бывшей пресвитерианской церкви 1920-х годов, перевезённой из Ward в 2003 году и названной часовней Sainte Solange. 43 место в топ-50 хозяйств НЗ The Real Review 2026; есть дегустация «из Сансера в Мальборо», понятная новичкам.", "wines": "Clos Henri Estate Sauvignon Blanc\nClos Henri Estate Pinot Noir\nOtira Sauvignon Blanc и Pinot Noir\nWaimaunga Sauvignon Blanc и Pinot Noir\nMuseum Release", "visit": "Пн–сб 10:00–16:00, последняя дегустация в 15:30 (так с 01.10.2026). Бронь обязательна, без записи место не гарантируют; если решили в последний момент, звонить +64 3 572 7923. Дегустации: Classic NZ$30, Sauvignon Blanc Odyssey NZ$40, The Sancerre to Marlborough Experience NZ$60, The Library NZ$90, тур по биоразнообразию Our Living Landscape NZ$150 (на сайте знак $). Зал маленький, лимит группы не указан. Бронь онлайн, contact@closhenri.com.", "approx": ""}, {"name": "Dog Point Vineyard", "lat": -41.5277, "lon": 173.8469, "region": "Мальборо", "site": "https://dogpoint.co.nz", "tier": "очень ценно", "tierColor": "#c0703a", "status": "ours", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: вне топ-50\nReal Review 2025: №41", "photo": {"src": "foto/dogpoint.jpg", "credit": "dogpoint.co.nz", "page": "https://dogpoint.co.nz"}, "why": "Хозяйство основали в 2004 году две семьи, Сазерленды и Хили; Иван Сазерленд и Джеймс Хили познакомились, работая в Cloudy Bay (Wine Companion). Визит камерный: проезд по винограднику и сидячая дегустация с вином 10-летней выдержки из библиотеки. В топ-50 хозяйств НЗ The Real Review 2026 его нет.", "wines": "Section 94 Sauvignon Blanc\nSauvignon Blanc\nChardonnay\nPinot Noir\nLibrary wine 10 лет (на дегустации)", "visit": "Дегустационной для свободного входа нет, на сайте прямо: «We don't have a cellar door». Есть тур с дегустацией: проезд по винограднику, 4 текущих вина и 1 библиотечное вино 10-летней выдержки, около часа. Пн–пт в 11:00, только по предварительной записи через кнопку на сайте. NZ$50 с человека (на сайте знак $, сайт новозеландский). Группа от 2 до 6 человек. Если время занято, писать на info@dogpoint.co.nz. NZ Wine даёт то же: пн–пт в 11:00 по записи.", "approx": ""}, {"name": "Fromm Winery", "lat": -41.5138, "lon": 173.8468, "region": "Мальборо", "site": "https://www.frommwinery.co.nz", "tier": "очень ценно", "tierColor": "#c0703a", "status": "ours", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №41\nReal Review 2025: №22", "photo": {"src": "foto/fromm.jpg", "credit": "frommwinery.co.nz", "page": "https://www.frommwinery.co.nz"}, "why": "Хозяйство про красное: пино нуар с разных участков, включая Clayvin, сира и мальбек, плюс вина из библиотеки. 41 место в топ-50 хозяйств НЗ The Real Review 2026. Единственное из нашего списка, где частную дегустацию прямо продают группам до 20 человек.", "wines": "Pinot Noir Fromm Vineyard\nPinot Noir Clayvin Vineyard\nPinot Noir The Curation\nSyrah (estate и single vineyard)\nMalbec", "visit": "Дегустационная 11:00–16:00 (дни недели на странице не указаны). Стол бронировать за 24 часа, без брони только если есть место. Дегустации за столом, 60 мин: белые и розе 4 вина NZ$22, красные 4 вина NZ$25, Signature 6 красных NZ$40, вертикаль The Curation 2020–2022 NZ$20. Частные (бронь за 24 часа через страницу контактов): для новичков 6 вин 90 мин NZ$75 (2–20 чел.), вслепую 6 вин NZ$75 (2–12 чел.), «Pinot in all its ways» 8 пино разных лет NZ$95, все текущие вина 120 мин NZ$125, все текущие и 3 библиотечных NZ$150 (2–20 чел.). Ресторана нет. office@frommwinery.co.nz, +64 3 572 9355. На сайте цены со знаком $, сайт новозеландский.", "approx": ""}, {"name": "Greywacke", "lat": -41.5454, "lon": 173.8201, "region": "Мальборо", "site": "https://www.greywacke.com", "tier": "хорошо", "tierColor": "#6a8d45", "status": "ours", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №49\nReal Review 2025: вне топ-50", "photo": null, "why": "Кевин Джадд был виноделом-основателем Cloudy Bay и вёл там первые 25 урожаев, Greywacke основал с женой в 2009 году (офсайт). 49 место в топ-50 хозяйств НЗ The Real Review 2026, их Botrytis Pinot Gris 2023 назван лучшим сладким вином года.", "wines": "Sauvignon Blanc (два разных стиля, один на диких дрожжах)\nPinot Noir\nChardonnay\nRiesling\nBotrytis Pinot Gris", "visit": "На офсайте о визитах ничего нет, только контакты и офис. NZ Wine: «Tastings by appointment only». Формат, цена и лимит группы нигде не опубликованы. Писать на info@greywacke.com или звонить +64 3 572 5425.", "approx": ""}, {"name": "Hans Herzog Estate", "lat": -41.4755, "lon": 173.8419, "region": "Мальборо", "site": "https://www.herzog.co.nz", "tier": "хорошо", "tierColor": "#6a8d45", "status": "ours", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: вне топ-50\nReal Review 2025: №14", "photo": {"src": "foto/hansherzog.jpg", "credit": "herzog.co.nz", "page": "https://www.herzog.co.nz"}, "why": "Семья из Швейцарии, на одном органическом участке 25 сортов (по сайту). Сами выделяют Nebbiolo. В топ-50 хозяйств НЗ The Real Review 2026 хозяйства нет.", "wines": "Nebbiolo\nвина малых партий (дегустация Signature Artisan)", "visit": "Пн–пт, только по записи: дегустации 9:00–16:00, продажа до 17:00; выходные и праздники закрыто, июнь–август тоже только по записи. Explorer Tasting 5 вин, ~45 мин, NZ$55; Signature Artisan 5 вин малых партий, ~45 мин, NZ$75; Private Tour & Tasting ~90 мин, от 2 человек, NZ$160. Встречи с хозяевами (NZ$690 за двоих и обед NZ$1800 за стол) только для членов их клуба. Верхний лимит группы не указан. Бронь онлайн, вопросы enjoy@herzog.co.nz, +64 3 572 8770. Цены на сайте со знаком $.", "approx": ""}, {"name": "No.1 Family Estate", "lat": -41.4837, "lon": 173.837, "region": "Мальборо", "site": "https://www.no1familyestate.co.nz", "tier": "хорошо", "tierColor": "#6a8d45", "status": "ours", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: вне топ-50\nReal Review 2025: вне топ-50", "photo": {"src": "foto/no1.jpg", "credit": "no1familyestate.co.nz", "page": "https://www.no1familyestate.co.nz"}, "why": "Даниэль Ле Брюн из семьи виноградарей Шампани: на офсайте «12 поколений», по NZ Wine виноград с 1684 года, шампанское с 1791. Хозяйство делает только вина классическим методом. Старую марку Daniel Le Brun семья продала в 1996, No.1 Family Estate запустила в 1999 (NZ Wine).", "wines": "No.1 Reserve NV (Blanc de Blancs)\nCuvée No.1 NV\nNo.1 Assemblé NV\nNo.1 Rosé NV\nNo.1 Reine Cuvée Reserve NV\nCuvée Remy 2013\nCuvée Virginie 2016\nCuvée Adele 2016", "visit": "Без записи для одиночек и небольших групп; от 6 человек бронь через cellardoor@no1wine.nz или (03) 572 9876. Дегустация линейки NV с возможностью доплатить за Reserve. Цену на офсайте не нашёл; NZ Wine пишет «complimentary tasting» (бесплатно). Часы на сайте противоречат друг другу: 7 дней 10:30–16:00 и зимний график (пн–вт только продажа 11–15, ср–сб дегустации 11–16, вс закрыто). Летом вероятнее первый вариант, уточнять.", "approx": ""}, {"name": "Wairau River Wines", "lat": -41.486, "lon": 173.8181, "region": "Мальборо", "site": "https://www.wairauriverwines.com", "tier": "хорошо", "tierColor": "#6a8d45", "status": "new", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: вне топ-50\nReal Review 2025: вне топ-50\nWorld's Best Vineyards 2025: №52", "photo": {"src": "foto/wairauriver.jpg", "credit": "wairauriverwines.com", "page": "https://www.wairauriverwines.com"}, "why": "World's 50 Best Vineyards 2025: 52 место, новичок списка. Семейное хозяйство с 1991 года, основали Фил и Крис Роуз, сейчас ведут их дети (the50.com). Ресторан Number 11 удобен как обед в винный день.", "wines": "Reserve Albariño\nReserve Grüner Veltliner\nReserve Syrah\nBotrytised Riesling\nReserve Chardonnay\nPinot Noir", "visit": "Дегустационная каждый день 10:00–16:00 (помечено как зимние часы), ресторан каждый день 11:00–16:00 (летние часы). Бронь онлайн на сайте, +64 3 572 9800. Цена дегустации и лимит группы не опубликованы. В гиде Marlborough Wine Trail 2024 ресторан и дегустационная значились закрытыми; сейчас сайт пишет, что открыто.", "approx": ""}, {"name": "Neudorf Vineyards", "lat": -41.2485, "lon": 172.9919, "region": "Нельсон", "site": "https://neudorf.co.nz", "tier": "обязательно", "tierColor": "#7b1e2b", "status": "new", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №8\nReal Review 2025: №24", "photo": {"src": "foto/neudorf.jpg", "credit": "neudorf.co.nz", "page": "https://neudorf.co.nz"}, "why": "8 место в топ-50 хозяйств НЗ The Real Review 2026, единственное хозяйство Нельсона в этом списке. Их Home Block Moutere Chardonnay 2024 назван лучшим белым вином года. Семейное органическое хозяйство с 1978 года.", "wines": "Home Block Moutere Chardonnay\nHome Block Moutere Pinot Noir\nMoutere Chardonnay\nMoutere Pinot Noir\nAlbariño\nRiesling", "visit": "Пн–чт 11:00–16:00, пт–вс 11:00–17:00. Neudorf Moutere Tasting: сидячая, вина с отдельных участков Моутере, NZ$35 (не берут при покупке 3 бутылок на человека), пн–вс в 11:00 и пн–пт в 14:00, мест мало, бронь на сайте. Neudorf Flight: 4 вина в саду самостоятельно, без Home Block, NZ$15, без брони, в пик может не быть. На дегустацию группой больше 4 писать cellardoor@neudorf.co.nz; самый большой стол для пикника на 8, +64 3 543 2643.", "approx": ""}, {"name": "Bell Hill", "lat": -42.9682, "lon": 172.705, "region": "Северный Кентербери", "site": "https://www.bellhill.co.nz", "tier": "обязательно", "tierColor": "#7b1e2b", "status": "ours", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №1\nReal Review 2025: №12", "photo": {"src": "foto/bellhill.jpg", "credit": "bellhill.co.nz", "page": "https://www.bellhill.co.nz"}, "why": "Винодельня года Новой Зеландии 2026 по The Real Review: №1 в топ-50, в 2025 было 12-е место (NZ Herald, 17.05.2026). Шардоне и пино с известнякового склона, тираж крошечный: в текущем релизе около 7 800 бутылок и 196 магнумов на все четыре вина, это примерно 650 ящиков (оценка по цифрам сайта). По Wine-Searcher (2024) Bell Hill Pinot Noir 4-е, а Chardonnay 6-е самое дорогое вино страны.", "wines": "Bell Hill Pinot Noir\nBell Hill Chardonnay\nSingle Parcel Shelf Pinot Noir\nSingle Parcel Limeworks Chardonnay\nOld Weka Pass Pinot Noir (есть в списке Wine-Searcher, на сайте хозяйства не нашёл)\nBeyond by Bell Hill с 2023 (Muirkirk, Bendigo, Southern Valleys Pinot Noir, Clayvin Chardonnay; виноград не из Вайкари, продают только по запросу)", "visit": "Для публики закрыто. На сайте: визиты «когда возможно», только по предварительной договорённости. Писать на info@bellhill.co.nz или звонить +64 3 314 2100, адрес и дорогу дают по запросу. Часов, цены и лимита группы на сайте нет. Quill & Pad (2024): закрыты, потому что не хватает людей. Группу 6–12 человек целиком скорее не примут (оценка).", "approx": ""}, {"name": "Pyramid Valley Vineyards", "lat": -42.9646, "lon": 172.6108, "region": "Северный Кентербери", "site": "https://www.pyramidvalley.co.nz", "tier": "обязательно", "tierColor": "#7b1e2b", "status": "ours", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №12\nReal Review 2025: №10", "photo": {"src": "foto/pyramidvalley.jpg", "credit": "pyramidvalley.co.nz", "page": "https://www.pyramidvalley.co.nz"}, "why": "№10 в топ-50 The Real Review 2025 и №12 в 2026. Виноградник на глине поверх известняка заложили Майк и Клаудия Вирсинг (земля куплена в 2000), органика и биодинамика; в 2017 хозяйство купили Brian Sheth и Steve Smith MW, винодел Huw Kinch с 2018 (Rural News Group). На визите наливают все пять вин серии Botanicals, это верх линейки.", "wines": "Lion's Tooth Chardonnay\nField of Fire Chardonnay\nAngel Flower Pinot Noir\nEarth Smoke Pinot Noir\nSnake's Tongue Pinot Noir\nNorth Canterbury Chardonnay и Pinot Noir (базовые)", "visit": "Только по записи. Botanicals Tour & Tasting: прогулка по винограднику, винодельня и дегустация всех пяти вин Botanicals. NZ$100 с человека, минимум 2. Пн–пт, начало в 11:00. Группа до 8 человек. Запись кнопкой Book now на pleasureculturecraft.com/pages/botanicals-tasting; если до визита меньше 5 дней, писать на info@pyramidvalley.co.nz, телефон +64 27 788 9463. Длительность не указана. Группу 9–12 человек придётся делить или договариваться письмом. Для ориентира: Botanicals 2024 в магазине хозяйства NZ$125 (пино) и NZ$150 (шардоне) за бутылку.", "approx": ""}, {"name": "Black Estate", "lat": -43.0387, "lon": 172.8129, "region": "Северный Кентербери", "site": "https://blackestate.co.nz", "tier": "очень ценно", "tierColor": "#c0703a", "status": "ours", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №14\nReal Review 2025: №36", "photo": {"src": "foto/black.jpg", "credit": "blackestate.co.nz", "page": "https://blackestate.co.nz"}, "why": "№14 в топ-50 The Real Review 2026 (№36 в 2025). Органика и биодинамика, BioGro 5202; вина с четырёх своих виноградников: Home, Damsteep, Netherwood, Skypunch. В ресторане есть сет Trust the Chef с подбором текущих и старых вин хозяйства.", "wines": "Home Pinot Noir\nDamsteep Riesling\nNetherwood Chardonnay\nSkypunch Pinot Gris", "visit": "Cellar door 7 дней 10:00–16:00, можно без записи. Дегустация 5 текущих вин NZ$30, не берут при покупке от 6 бутылок. Сет из 3 вин за столом в ресторане NZ$35–50 (по 50 мл). Группы от 5 человек бронируют по +64 3 314 6085 или bookings@blackestate.co.nz. Приватный тур с дегустацией 5 вин отдельных виноградников и закуской на Netherwood: NZ$125, начало 11:00, 1–1,5 часа, не больше 6 человек в день, оплата при брони. Ресторан чт–пн 11:30–16:00, Trust the Chef из 4 блюд NZ$139, с подбором текущих и старых вин NZ$210; в прочие праздничные дни наценка 15%.", "approx": ""}, {"name": "Pegasus Bay", "lat": -43.0919, "lon": 172.7689, "region": "Северный Кентербери", "site": "https://www.pegasusbay.com", "tier": "очень ценно", "tierColor": "#c0703a", "status": "ours", "plan": "Нет", "origin": "Совет", "somm": "", "rating": "Real Review 2026: №21\nReal Review 2025: вне топ-50", "photo": {"src": "foto/pegasusbay.jpg", "credit": "pegasusbay.com", "page": "https://www.pegasusbay.com"}, "why": "№21 в топ-50 The Real Review 2026 (в топ-50 2025 не было). Семейное хозяйство Дональдсонов: основатель Иван Дональдсон посадил один из первых виноградников Кентербери в 1976, Pegasus Bay основан в 1986, лозы около 40 лет, много на своих корнях (сайт). Главная причина ехать: программа 10-летних выдержанных релизов с 2006 года и старые бутылки, которые можно выпить на месте.", "wines": "Prima Donna Pinot Noir (делают только в лучшие годы)\nPinot Noir (Estate)\nRiesling (Estate)\nBel Canto Dry Riesling\nAria Late Picked Riesling\nVirtuoso Chardonnay\nMaestro Merlot Malbec\nMinuetto Semillon Sauvignon\nEncore Noble Riesling\nFinale Noble Semillon Sauvignon\nFortissimo Fortified Muscat\nAged Release Pinot Noir и Prima Donna (сейчас 2016)", "visit": "Дегустационная чт–пн 10:00–17:00, вт–ср закрыто. Classic Tasting NZ$20, Reserve Tasting NZ$40, сбор возвращают при покупке от 6 бутылок. Группы не больше 10 человек, больше не принимают вообще. Обязательной записи сайт не требует, но группе лучше написать на cellardoor@pegasusbay.com (+64 3 314 6869 доб. 811). Ресторана больше нет: на сайте только дегустационная и Mini Deli (самообслуживание, корзинка с местными закусками, чт–пн 10:30–16:30, без брони, группы от 15 не гарантируют, свою еду и напитки нельзя). Mini Deli появился в сезон 2021/22; справочники вроде AAA и Yellow ещё пишут «ресторан», это устарело.\nСтарые винтажи: 1) Aged Release с 2006: каждый год откладывают немного рислинга и пино нуар и выпускают через 10 лет. Сейчас в магазине Pinot Noir 2016 Aged Release NZ$80 и Prima Donna 2016 Aged Release NZ$140. 2) В онлайн-магазине есть музейные ящики по 12 бутылок (выложены в феврале и июле 2026): Museum Premium Red & White NZ$795 (Riesling 2012, Pinot Noir 2014, Prima Donna 2011, Virtuoso 2016, Maestro 2015, Finale 2011 и др.), Museum Premium White NZ$695 (Encore Noble Riesling 2010, Virtuoso 2013 и 2016, Gewürztraminer 2012 и др.), Aged Nectar NZ$550 (Aria 2006, 2013, 2016, 2018, Encore 2007–2016, Finale 2010–2019), Vertical Pack NZ$520 (по 6 винтажей Estate Pinot Noir 2017–2022 и Riesling 2019–2024). 3) В дегустационной есть доска со старыми винами на продажу «по очень разумным ценам» и большие форматы. Наливают ли старые вина на самой дегустации, сайт не говорит; Reserve Tasting за NZ$40 включает флагманские reserve-вина. 4) В Mini Deli старые бутылки можно открыть на месте, только целой бутылкой: Virtuoso Chardonnay 2008 NZ$135, Encore Noble Riesling 2007 (375 мл) NZ$85, Prima Donna 2016 NZ$180, Pinot Noir 2016 NZ$190, Maestro 2016 NZ$150, Riesling 2016 NZ$68, Gewürztraminer 2014 NZ$65, Aria 2016, Bel Canto 2020, Minuetto 2021 и Finale Noble Sauvignon Blanc 2014 по NZ$85. Из этого можно собрать мини-вертикаль к обеду на 8–10 человек. 5) Приватной дегустации или вертикали по заказу на сайте нет, спрашивать письмом на cellardoor@pegasusbay.com заранее. В сезон 2021/22 они проводили воскресные обеды со старыми винами из «библиотеки Дональдсонов», сейчас такого на сайте нет. 6) Своего игристого нет: ни в магазине (около 50 позиций), ни в карте кафе; пузырьки в кафе чужие (Quartz Reef, Louis Roederer).", "approx": ""}, {"name": "Greystone", "lat": -43.0471, "lon": 172.7868, "region": "Северный Кентербери", "site": "https://www.greystonewines.co.nz", "tier": "хорошо", "tierColor": "#6a8d45", "status": "ours", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: вне топ-50\nReal Review 2025: №35\nWorld's Best Vineyards 2025: №89", "photo": {"src": "foto/greystone.jpg", "credit": "greystonewines.co.nz", "page": "https://www.greystonewines.co.nz"}, "why": "№35 в топ-50 The Real Review 2025, в топ-50 2026 нет. №89 в World's 50 Best Vineyards 2025 (список 51–100; это рейтинг винного туризма, не только вина). Сертифицированная органика BioGro.", "wines": "Vineyard Ferment Pinot Noir (сайт называет его главным вином)\nChardonnay (сайт пишет про флагманские шардоне, названий не нашёл)\nPinot Noir\nSyrah\nPétillant Naturel", "visit": "Cellar door и ресторан открыты 7 дней: чт–пн 11:00–16:30, вт–ср 11:00–16:00. Дегустация пяти вин (на 28.10.2026: Pét-Nat 2023, Pinot Gris 2025, Sauvignon Blanc 2024, Pinot Noir 2021, Syrah 2023), цену дегустации на сайте не нашёл. Обед Vineyard Lunch из 4 блюд NZ$116, с винами NZ$160. От 6 человек бронь с картой и плата за отмену позже 48 часов; от 7 человек только Vineyard Lunch; обед от 7 и дегустация от 8 человек бронируются по почте (адрес на странице скрыт), телефон +64 3 314 6100.", "approx": ""}, {"name": "The Boneline", "lat": -43.086, "lon": 172.6917, "region": "Северный Кентербери", "site": "https://theboneline.co.nz", "tier": "хорошо", "tierColor": "#6a8d45", "status": "new", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: вне топ-50\nReal Review 2025: №50", "photo": {"src": "foto/theboneline.jpg", "credit": "theboneline.co.nz", "page": "https://theboneline.co.nz"}, "why": "№50 в топ-50 The Real Review 2025 (в 2026 в топ-50 нет). Семейное партнёрство с 1989 года, виноградники на террасах реки Вайпара (Wine Collective). В cellar door есть библиотека прошлых винтажей, которые продают только там, и магнумы особых лет.", "wines": "Waimanu Pinot Noir\nIridium\nSharkstone Chardonnay\nHell Block Riesling\nDry Riesling", "visit": "Cellar door чт–пн 11:00–16:00, вт–ср закрыто. Сидячая дегустация всей линейки NZ$30, не берут при покупке от 3 бутылок. При брони списывают депозит NZ$30 с человека в счёт покупок, без возврата, если отменить позже чем за 48 часов. Группы больше 12 человек только по телефону 03 314 8699 или почте. Закуски для общего стола каждый день. Тропа по винограднику чт–пн 11:00–16:00.", "approx": ""}, {"name": "Mountford Estate", "lat": -43.0449, "lon": 172.805, "region": "Северный Кентербери", "site": "Рабочего сайта не нашёл: mountfordvineyard.co.nz (указан у Jamie Goode) не открывается 28.10.2026; страница хозяйства в приложении Pearl: https://joinpearl.co/wineries/waipara/mountford-estate", "tier": "можно пропустить", "tierColor": "#9a9a9a", "status": "new", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: вне топ-50\nReal Review 2025: вне топ-50", "photo": null, "why": "Пино нуар с известняка, винодел C.P. Lin (En Primeur Club, Tyson Stelzer). Высокие оценки Jamie Goode (Chardonnay 2008 95/100, The Gradient Pinot Noir 2008 94/100), но это 2012–2013 годы. В топ-50 The Real Review 2025 и 2026 нет.", "wines": "The Gradient Pinot Noir (есть версия Vieilles Vignes)\nMountford Pinot Noir\nVillage Pinot Noir\nChardonnay\nPure Riesling", "visit": "Только по записи, через приложение Pearl (форматы Flight, Private Tasting, Vineyard Tour). Цен, часов и лимита группы не нашёл. Данные Pearl на сентябрь 2026.", "approx": ""}, {"name": "Clos Ostler (бывший Ostler)", "lat": -44.7339, "lon": 170.4695, "region": "Вайтаки", "site": "не нашёл рабочего: ostler.co.nz и closostler.co.nz не открываются (28.10.2026)", "tier": "можно пропустить", "tierColor": "#9a9a9a", "status": "new", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: вне топ-50\nReal Review 2025: вне топ-50", "photo": null, "why": "Caroline's Pinot Noir 2021 получил трофеи «лучшее красное НЗ» и «лучший пино нуар НЗ» на International Wine Challenge 2025. Долина маленькая (около 45 га, 13 виноградников), склоны на известняке; Боб Кэмпбелл в Decanter (2014) описывал местный пино как более сдержанный и тонкий, чем в Центральном Отаго (в пересказе Википедии).", "wines": "Clos Ostler Caroline's Pinot Noir\nClos Ostler Eos Pinot Noir", "visit": "Работающий погреб не подтвердил: сайты не открываются, Lonely Planet описывал дегустационный зал Vintner's Drop в старой почте Куроу, один агрегатор пишет «закрыто навсегда». Дорога: Квинстаун - Куроу 221 км, около 2 ч 55 мин; Ванака - Куроу 165 км, около 2 ч 10 мин; Омарама - Куроу 52 км, около 40 мин (расчёт OSRM, без остановок).", "approx": ""}, {"name": "Felton Road", "lat": -45.0745, "lon": 169.1306, "region": "Центральное Отаго", "site": "https://feltonroad.com", "tier": "обязательно", "tierColor": "#7b1e2b", "status": "plan", "plan": "День 15, чт 13.01 (19 дн) / день 13, вт 11.01 (15 дн)", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №2\nReal Review 2025: №1\nWorld's Best Vineyards 2025: №98", "photo": {"src": "foto/feltonroad.jpg", "credit": "feltonroad.com", "page": "https://feltonroad.com"}, "why": "Винодельня года НЗ по The Real Review в 2024 и 2025, в рейтинге 2026 на втором месте после Bell Hill. Бесплатный визит с прогулкой по участкам и сидячей дегустацией блоков. Биодинамика с 2002 года, Demeter на всех четырёх виноградниках с 2010, BioGro с 2020 (в нашем файле было «с 1991», это ошибка: в 1991 только нашли участок).", "wines": "Pinot Noir Block 3\nPinot Noir Block 5\nPinot Noir Calvert\nPinot Noir Cornish Point\nPinot Noir MacMuir\nPinot Noir Bannockburn\nChardonnay Block 2\nChardonnay Block 6\nRiesling Block 1\nDry Riesling", "visit": "Только по предварительной записи, пн-пт; выходные и госпраздники закрыто. Два визита в день, обычно в 10:30 или 13:30, длительность 1,5-2 часа: рассказ о хозяйстве, прогулка по винограднику и винодельне, потом сидячая дегустация текущих релизов. Бесплатно. На сайте: «большие группы не принимаем», конкретного числа нет; рекомендуют только для взрослых. Запись: ссылка «click here» на странице Cellar Door открывает письмо с темой «Cellar Door Visit» на почту сотрудника хозяйства; общий адрес на странице контактов wines@feltonroad.com; телефон +64 3 445 0885. Наши даты чт 13.01.2028 (длинный вариант) и вт 11.01.2028 (короткий) будни, подходят. Группу 10-12 человек, скорее всего, придётся делить на два визита (10:30 и 13:30) или спрашивать заранее.", "approx": ""}, {"name": "Rippon", "lat": -44.6949, "lon": 169.1047, "region": "Центральное Отаго", "site": "https://rippon.co.nz", "tier": "обязательно", "tierColor": "#7b1e2b", "status": "plan", "plan": "День 11, вс 09.01 (19 дн) / день 9, пт 07.01 (15 дн)", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №9\nReal Review 2025: №8\nWorld's Best Vineyards 2025: №44", "photo": {"src": "foto/rippon.jpg", "credit": "rippon.co.nz", "page": "https://rippon.co.nz"}, "why": "№9 в топ-50 виноделен НЗ The Real Review 2026. Одни из самых ранних лоз региона: первые опытные ряды в 1975, виноградник с 1982, склон к озеру Ванака. Редкий сорт Osteiner (скрещивание рислинга и сильванера). «Самый снимаемый виноградник страны» подтверждается только рекламным каталогом, не рейтингом.", "wines": "Rippon Mature Vine Pinot Noir\nRippon Tinker's Field Mature Vine Pinot Noir\nRippon Emma's Block Mature Vine Pinot Noir\nRippon Mature Vine Riesling\nRippon Osteiner\nRippon Gewurztraminer", "visit": "Пробовать только по записи (онлайн через Acuity на сайте). Cellar Door Tasting: бесплатно, около 30 минут, сеансы каждые полчаса, максимум 6 человек на запись. Private Tasting: NZ$45 с человека, около часа, от 2 до 20 человек, только пн-пт в 11:00. Неявка NZ$10 с человека, при записи берут данные карты (российская карта, скорее всего, не пройдёт). Опоздание больше 10 минут: могут не принять. На сайте общая фраза «по записи с 11 до 17, 7 дней в неделю», а в расписании текущей недели (октябрь): вс 12-17, пн 12-17, чт 12-17, пт 12-17, сб 11-14, среды нет, во вторнике опечатка. Воскресенье открыто, но приватной в вс нет: в вс 09.01.2028 группу 10-12 человек придётся делить на две записи по 6. В пт 07.01.2028 (короткий вариант) можно взять приватную на всю группу в 11:00. Группы больше 20 и вопросы: cellardoor@rippon.co.nz, 03 443 8084.", "approx": ""}, {"name": "Kinross", "lat": -45.0287, "lon": 168.9684, "region": "Центральное Отаго", "site": "https://kinross.nz", "tier": "очень ценно", "tierColor": "#c0703a", "status": "plan", "plan": "День 15, чт 13.01 (19 дн) / день 13, вт 11.01 (15 дн)", "origin": "Сам", "somm": "", "rating": "Real Review 2026: вне топ-50\nReal Review 2025: вне топ-50\nНаливают Wild Irishman: Real Review 2026 №20, 2025 №26", "photo": {"src": "foto/kinross.jpg", "credit": "kinross.nz", "page": "https://kinross.nz"}, "why": "Одна дегустационная на пять марок: Kinross, Valli, Wild Irishman, Hawkshead, High Garden. Wild Irishman №20 в топ-50 Real Review 2026. Coal Pit из нашего файла среди партнёров больше нет.", "wines": "Valli Gibbston Pinot Noir\nValli Bannockburn Pinot Noir\nValli Bendigo Pinot Noir\nValli Waitaki Pinot Noir\nWild Irishman 'Three Colleens' Gibbston Pinot Noir\nWild Irishman 'Macushla' Gibbston Pinot Noir\nHawkshead First Vines Gibbston Pinot Noir\nHigh Garden Vineyard Gibbston Pinot Noir\nKinross Storm Cloud Gibbston Pinot Noir", "visit": "Ежедневно 10:00-17:00, последняя дегустация в 16:30; бистро 11:00-19:00. Форматы, NZ$ с человека: Classic Experience 30; Pinot Noir Experience 50 (от 6 человек); Premium Central Otago Experience 75 (от 6 человек); Kinross Wine Experience 25; Valli Wine Experience от 50; Wild Irishman Wine Experience от 50; Behind the Vines (тур по винограднику и 6 вин разных субрегионов) от 120 (от 4 человек). Запись через «Book your tasting» на сайте; обязательна ли, не сказано. Длительность и максимум группы не указаны. Контакты: info@kinross.nz, +64 3 746 7269. Есть коттеджи на винограднике.", "approx": ""}, {"name": "Valli", "lat": -45.0287, "lon": 168.9714, "region": "Центральное Отаго", "site": "https://www.valliwine.com", "tier": "очень ценно", "tierColor": "#c0703a", "status": "plan", "plan": "День 15, чт 13.01 (19 дн) / день 13, вт 11.01 (15 дн), через Kinross", "origin": "Сам", "somm": "", "rating": "Real Review 2026: вне топ-50\nReal Review 2025: №45", "photo": {"src": "foto/valli.jpg", "credit": "valliwine.com", "page": "https://www.valliwine.com"}, "why": "Грант Тейлор делает вино в Отаго с 1993 и делал первые вина для нескольких известных хозяйств региона (сайт Valli), марка с 1998. Четыре пино из Гибстона, Баннокберна, Бендиго и Вайтаки рядом: наглядный урок по субрегионам.", "wines": "Valli Gibbston Pinot Noir\nValli Bannockburn Pinot Noir\nValli Bendigo Pinot Noir\nValli Waitaki Pinot Noir\nValli 'Real McCoy' Gibbston Pinot Gris Orange\nValli 'Dolce Vita' Waitaki Late Harvest Riesling", "visit": "В Центральном Отаго своего зала нет: пробовать в Kinross по соседству с их участком в Гибстоне, Valli Wine Experience от NZ$50, запись через Kinross (0800 131 101, +64 3 746 7269, wine@kinross.nz). Свой зал есть, но в Северном Отаго: VALLI Wine Bar в старом почтамте, 45 Bledisloe Street, Kurow (долина Вайтаки); летом ежедневно 12:00-18:30, в пт и сб до 20:00; дегустации и группы по записи: 03 262 6262, winebar@valliwine.com. Координаты карточки даны по Kinross, бар в Куроу: -44.7334, 170.4700. В нашем файле было «своего cellar door нет», это неточно.", "approx": ""}, {"name": "Gibbston Valley", "lat": -45.0123, "lon": 168.9152, "region": "Центральное Отаго", "site": "https://www.gibbstonvalley.com", "tier": "хорошо", "tierColor": "#6a8d45", "status": "plan", "plan": "День 15, чт 13.01 (19 дн) / день 13, вт 11.01 (15 дн)", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №44\nReal Review 2025: №25", "photo": {"src": "foto/gibbstonvalley.jpg", "credit": "gibbstonvalley.com", "page": "https://www.gibbstonvalley.com"}, "why": "Первый коммерческий пино региона, урожай 1987 (ODT 2021, winewithseth); сам сайт этих страниц не отдал. Пещера-погреб, взорванная в сланцевой скале в 1993-1995; винодельня называет её крупнейшей винной пещерой НЗ. «Единственный погреб в скале в регионе» не подтвердилось: сами пишут «крупнейшая», подземный погреб есть, например, у Monte Christo в Клайде.", "wines": "Gibbston Valley Le Maître Pinot Noir\nGibbston Valley China Terrace Pinot Noir\nGibbston Valley Glenlee Pinot Noir", "visit": "Cellar door ежедневно 10:00-17:00 по nzwine.com и arrowtown.com (официальный сайт часы не отдал); на обычную дегустацию записи не нужно (arrowtown.com). Туры с сайта винодельни: Classic Cave Tour NZ$30, 30 минут, 3 вина, старты 10:00, 11:00, 13:00, 15:00; Complete Winery Tour (виноградник, винодельня, пещера, 4 вина) от NZ$50, 45 минут, 11:45 и 15:45; Cave Library (5 вин, включая выдержанный винтаж, в нише пещеры) от NZ$65, 45 минут. Запись на туры кнопкой Book Now. Моложе 16 лет на туры и дегустации не пускают. Есть ресторан. Лимит группы не указан. info@gibbstonvalley.com.", "approx": ""}, {"name": "Amisfield", "lat": -44.9866, "lon": 168.8158, "region": "Центральное Отаго", "site": "https://www.amisfield.co.nz", "tier": "обязательно", "tierColor": "#7b1e2b", "status": "new", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: вне топ-50\nReal Review 2025: вне топ-50", "photo": {"src": "foto/amisfield.jpg", "credit": "amisfield.co.nz", "page": "https://www.amisfield.co.nz"}, "why": "Главная гастрономическая точка региона: по данным самого Amisfield одна звезда Michelin и три колпака Cuisine (19,5/20) в 2019-2026. В 2025 году 3-е место в мире в Global Tastemaker Awards журнала Food & Wine и 99-е место в расширенном списке World's 50 Best Restaurants. В погребе можно попробовать старые винтажи пино (до 2012 в магнумах) и выдержанные белые.", "wines": "RKV Pinot Noir\nBreakneck Pinot Noir\nPinot Noir (вертикаль 2015-2023)\nFumé Sauvignon Blanc\nLowburn Terrace Riesling\nChenin Blanc\nMéthode Traditionnelle Brut", "visit": "Дегустации: Explorer, 5 вин, 30 мин, NZ$40; Connoisseur, 6 вин с премиальными и старыми винтажами, 45-60 мин, NZ$65; Curator, библиотека и две особые позиции, 60-75 мин, NZ$125, только по записи. За первые две не берут плату при покупке. Погреб ср-вс 11:30-17:00, бистро ср-вс 11:30-15:30, вечерний ресторан ср-вс с 18:30 (дегустационное меню NZ$490 с человека, винное сопровождение отдельно, цену не нашёл). С 20 декабря бистро и ресторан работают вт-вс. Без записи можно группой до 7 человек, больше 7 бронируют по cellardoor@amisfield.co.nz. Бистро и ресторан бронируются только онлайн (SevenRooms).", "approx": ""}, {"name": "Terra Sancta", "lat": -45.0713, "lon": 169.1302, "region": "Центральное Отаго", "site": "https://www.terrasancta.co.nz", "tier": "обязательно", "tierColor": "#7b1e2b", "status": "new", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №18\nReal Review 2025: №29", "photo": {"src": "foto/terrasancta.jpg", "credit": "terrasancta.co.nz", "page": "https://www.terrasancta.co.nz"}, "why": "Хозяйство пишет, что у него первые лозы, посаженные в Баннокберне. Джеймс Саклинг в топ-100 вин НЗ 2025 назвал Mysterious Diggings 2024 вином года Новой Зеландии, а Slapjack Block 2024 (№9) «возможно, величайшим» пино НЗ, что он пробовал. В рейтинге хозяйств Real Review 2026 №18, это выше всех Отаго вне нашего списка.", "wines": "Slapjack Block Pinot Noir (Bannockburn)\nMysterious Diggings Pinot Noir (Bannockburn)\nрозе и Botanical Aperitivo (упомянуты на сайте, в продаже не проверял)", "visit": "Сидячая дегустация NZ$15 с человека, засчитывается при покупке бутылки. Летние часы на сайте: пн, чт, пт 9:00-14:00; в форме записи слоты пн, вт, чт, пт 11:00-14:00 (на одной странице расходятся). Запись желательна, через форму на сайте минимум за 24 часа. Группа: в одном месте максимум 6 человек, в форме до 8. Группу 10-12 делить на два слота или договариваться по wine@terrasancta.co.nz.", "approx": ""}, {"name": "Burn Cottage", "lat": -45.0509, "lon": 169.1933, "region": "Центральное Отаго", "site": "https://burncottage.com", "tier": "очень ценно", "tierColor": "#c0703a", "status": "ours", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №22\nReal Review 2025: вне топ-50", "photo": {"src": "foto/burncottage.jpg", "credit": "burncottage.com", "page": "https://burncottage.com"}, "why": "Burn Cottage Sabines Selection Pinot Noir 2022 назван красным вином года НЗ в Real Review 2026 (97/100); винодельня №22 в топ-50. Биодинамика с первого дня; у истоков стояли Тед Лемон (Littorai) и Питер Проктор.", "wines": "Burn Cottage Sabines Selection Pinot Noir\nBurn Cottage Vineyard Pinot Noir\nBurn Cottage Sauvage Vineyard Pinot Noir\nBurn Cottage Moonlight Race Pinot Noir\nBurn Cottage Vineyard Riesling Gruner Veltliner", "visit": "Гостей принимают, но только по записи: пн-пт 11:00-16:00, около 40 минут, с сотрудником хозяйства, текущие релизы. Проходит на винодельне в промзоне Кромвеля (Units 3&4, 7 Rogers Street), не на винограднике. Запись формой на сайте (имя, почта, телефон, число гостей) или по телефону 03 445 3670; советуют бронировать сильно заранее. Цена и лимит группы не указаны.", "approx": ""}, {"name": "Prophet's Rock", "lat": -44.9409, "lon": 169.3184, "region": "Центральное Отаго", "site": "https://www.prophetsrock.co.nz", "tier": "очень ценно", "tierColor": "#c0703a", "status": "ours", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №3\nReal Review 2025: №6", "photo": {"src": "foto/prophetsrock.jpg", "credit": "prophetsrock.co.nz", "page": "https://www.prophetsrock.co.nz"}, "why": "№3 в топ-50 Real Review 2026, выше в Отаго только Felton Road. С 2009 винодел Пол Пухоль делает Cuvée Aux Antipodes вместе с Франсуа Милле из Domaine Comte Georges de Vogüé (Бургундия). Vin de Paille 2022 в финале «сладкое вино года» Real Review 2026.", "wines": "Prophet's Rock Cuvée Aux Antipodes Pinot Noir\nProphet's Rock Retrospect Pinot Noir\nProphet's Rock Olearia Pinot Noir\nProphet's Rock Vin de Paille", "visit": "Дегустационного зала с часами нет, только визиты по записи: с виноделом, виноградник и винодельня, потом дегустация лучших вин; от 90 минут, только 18+. Отмена не позже чем за 24 часа. Запись по телефону 03 443 8217 или почтой (на сайте wineclub@prophetsrock.co.nz). Дни, цена и лимит группы не указаны.", "approx": ""}, {"name": "Quartz Reef", "lat": -45.0512, "lon": 169.1819, "region": "Центральное Отаго", "site": "https://www.quartzreef.co.nz", "tier": "очень ценно", "tierColor": "#c0703a", "status": "ours", "plan": "Нет. Зал в Кромвеле, маршрут дня 15 (Текапо → Баннокберн) идёт через Кромвель", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №5\nReal Review 2025: вне топ-50", "photo": {"src": "foto/quartzreef.jpg", "credit": "quartzreef.co.nz", "page": "https://www.quartzreef.co.nz"}, "why": "№5 в топ-50 Real Review 2026, основатель Руди Бауэр (родом из Зальцбурга) назван Vigneron of the Year 2026. Игристое классическим методом делают на месте, в зале видно бутылки на осадке и пюпитры. Виноградник в Бендиго: Demeter с 2011.", "wines": "Quartz Reef Méthode Traditionnelle Brut NV\nQuartz Reef Méthode Traditionnelle Rosé NV\nQuartz Reef Pinot Noir\nQuartz Reef Single Ferment 'Velvet' Pinot Noir\nQuartz Reef Pinot Gris", "visit": "Пн-пт 12:00-16:00, сб и вс закрыто. Дегустация NZ$15 с человека, засчитывается при покупке вина: игристое, пино и вина хозяйства. Запись рекомендуется, ссылка «Book a tasting at Quartz Reef» на странице Visit Us. Зал внутри винодельни в Кромвеле (8 Hughes Crescent, в конце Pinot Noir Drive), не на винограднике в Бендиго; в нашем файле было «в 8 км от Кромвеля», это неверно. Лимит группы не указан. info@quartzreef.co.nz, 03 445 3084.", "approx": ""}, {"name": "Carrick", "lat": -45.0813, "lon": 169.1792, "region": "Центральное Отаго", "site": "https://www.carrick.co.nz", "tier": "хорошо", "tierColor": "#6a8d45", "status": "ours", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: вне топ-50\nReal Review 2025: вне топ-50", "photo": {"src": "foto/carrick.jpg", "credit": "carrick.co.nz", "page": "https://www.carrick.co.nz"}, "why": "Сертифицированная органика с 2008, лозы с 1994, ресторан и сад; выдержанные вина можно попробовать по бокалу через систему хранения. В топ-50 Real Review 2026 нет.", "wines": "Carrick Excelsior Pinot Noir\nCarrick Bannockburn Pinot Noir\nCarrick EBM Chardonnay\nCarrick Bannockburn Chardonnay\nCarrick Josephine Riesling", "visit": "Ежедневно. Страница Plan Your Visit: cellar door 9:00-18:30 летом (зимой 10-17), tutored tastings 10-17, ресторан 11-17 (полное меню до 15:00). Страница Cellar Door при этом пишет 10:00-17:00, источники расходятся. Форматы: с сотрудником (tutored), самостоятельно (self-guided), тур по винограднику с дегустацией; туры пн-пт в 11:00, группам по договорённости. Онлайн-бронь до 12 человек, больше через dine@carrick.co.nz. Цены на сайте не указаны.", "approx": ""}, {"name": "Mora (бывший погреб Akarua)", "lat": -44.9645, "lon": 168.8175, "region": "Центральное Отаго", "site": "https://www.mora.co.nz", "tier": "хорошо", "tierColor": "#6a8d45", "status": "new", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: №35\nReal Review 2025: вне топ-50", "photo": {"src": "foto/mora.jpg", "credit": "mora.co.nz", "page": "https://www.mora.co.nz"}, "why": "№35 в рейтинге хозяйств Real Review 2026 (указан как Bannockburn). Бренд семьи, основавшей Akarua в 1996 году, запущен после продажи Akarua французской Edmond de Rothschild Heritage; 90 га сложившихся виноградников Баннокберна и Пизы. Погреб открыт 7 дней в неделю, на месте ресторан Artisan Kitchen.", "wines": "Kolo Pinot Noir\nVale Pinot Noir\nEden Chardonnay\nOld Vine Sauvignon Blanc\nVintage Brut", "visit": "Каждый день 10:00-17:00. Дегустация 5 вин из Central Otago и Single Site Series (Kolo, Eden, Vale), NZ$25, 30-45 мин, с хостом; сидя в саду, у уличного бара или внутри. Обед в Artisan Kitchen по желанию. Бронь онлайн, по телефону 021 023 72489 или cellardoor@mora.co.nz. Группы до 8 человек, больше по согласованию. На странице расхождение: вверху «бронь обязательна», в FAQ «без записи, если есть места».", "approx": ""}, {"name": "Mount Edward", "lat": -45.0258, "lon": 168.9556, "region": "Центральное Отаго", "site": "https://www.mountedward.com", "tier": "хорошо", "tierColor": "#6a8d45", "status": "new", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: вне топ-50\nReal Review 2025: вне топ-50", "photo": {"src": "foto/mountedward.jpg", "credit": "mountedward.com", "page": "https://www.mountedward.com/about"}, "why": "Органические виноградники в трёх субрегионах (логотип BioGro на сайте) и самая широкая линейка «не только пино» в Гиббстоне: гаме, шенен, вермут, оксидативные и мацерированные вина. Есть библиотечная дегустация старых винтажей. Статуса у критиков не нашёл: в топ-50 Real Review 2026 его нет.", "wines": "Morrison Vineyard Pinot Noir (Lowburn)\nPinot Noir\nGamay\nChenin Blanc\nChardonnay\nлинейка Avant-garde (мацерация, оксидативные, вермут)", "visit": "Погреб каждый день 11:00-17:00. Дегустации: линейка погреба NZ$45; библиотека, Avant-garde или только пино NZ$75; вино с едой до 7 подач NZ$110 с человека (валюта на сайте не указана, по контексту NZ$). Тапас чт-пн, вт-ср только лёгкие закуски. Бронь гарантирует стол, без записи пускают при наличии мест. Группы больше 6 человек звонят +64 3 442 6113 или пишут cellardoor@mountedward.com.", "approx": ""}, {"name": "Mt Difficulty", "lat": -45.0823, "lon": 169.1548, "region": "Центральное Отаго", "site": "https://www.mtdifficulty.nz", "tier": "хорошо", "tierColor": "#6a8d45", "status": "ours", "plan": "Нет", "origin": "Сам", "somm": "", "rating": "Real Review 2026: вне топ-50\nReal Review 2025: №33", "photo": {"src": "foto/mtdifficulty.jpg", "credit": "mtdifficulty.nz", 44.4673, 169.9883], [-44.4788, 169.983], [-44.5146, 169.8281], [-44.5135, 169.7976], [-44.4978, 169.7564], [-44.5293, 169.7137], [-44.5619, 169.6899], [-44.5652, 169.661], [-44.5876, 169.6473], [-44.577, 169.6196], [-44.6115, 169.5304], [-44.6754, 169.4782], [-44.695, 169.4846], [-44.7043, 169.5026], [-44.7326, 169.5091], [-44.8111, 169.504], [-44.8019, 169.4735], [-44.8072, 169.4504], [-44.8355, 169.4267], [-44.8378, 169.4078], [-44.8886, 169.3375], [-44.993, 169.2413], [-45.0392, 169.2232], [-45.0343, 169.1922], [-45.0412, 169.177], [-45.0557, 169.1639], [-45.0761, 169.1704], [-45.0859, 169.1595], [-45.0761, 169.1704], [-45.0525, 169.1282], [-45.0356, 169.1198], [-45.0028, 169.0784], [-45.0048, 169.0643], [-45.034, 169.0378], [-45.0596, 169.0421], [-45.0564, 169.0302], [-45.0459, 169.0291], [-45.0192, 168.9469], [-45.0094, 168.8872], [-44.9772, 168.8504], [-44.9801, 168.8248], [-44.9954, 168.8037], [-45.0017, 168.7566], [-45.0337, 168.6808], [-45.0312, 168.6626]]}, {"label": "День 16: к Даутфул-Саунд", "path": [[-45.0312, 168.6626], [-45.0338, 168.6806], [-45.0156, 168.7316], [-45.0299, 168.7337], [-45.0384, 168.7527], [-45.1165, 168.7626], [-45.2271, 168.7392], [-45.2874, 168.7651], [-45.3276, 168.7426], [-45.3956, 168.6703], [-45.4198, 168.6752], [-45.4291, 168.7032], [-45.4595, 168.6928], [-45.4941, 168.6645], [-45.5179, 168.6217], [-45.5093, 168.5556], [-45.5351, 168.5482], [-45.5563, 168.5067], [-45.5714, 168.5036], [-45.5895, 168.4799], [-45.6236, 168.4586], [-45.6121, 168.4223], [-45.6556, 168.2528], [-45.6706, 168.2411], [-45.6583, 168.2009], [-45.5665, 168.0938], [-45.5597, 168.0209], [-45.539, 167.9692], [-45.5454, 167.8928], [-45.5222, 167.8329], [-45.5214, 167.7909], [-45.5034, 167.7808], [-45.4651, 167.7931], [-45.4388, 167.7802], [-45.4145, 167.718], [-45.4496, 167.7209], [-45.4631, 167.7032], [-45.4929, 167.6977], [-45.5092, 167.6525], [-45.5641, 167.615]]}, {"label": "День 18 (только 19 дн)", "path": [[-45.0312, 168.6626], [-45.041, 168.637], [-45.0463, 168.63], [-45.0476, 168.6225], [-45.0529, 168.6188], [-45.0558, 168.6131], [-45.0573, 168.5901], [-45.0545, 168.5839], [-45.061, 168.5701], [-45.0596, 168.5632], [-45.0665, 168.5398], [-45.0706, 168.5007], [-45.0788, 168.4857], [-45.0807, 168.4764], [-45.0795, 168.469], [-45.0772, 168.4662], [-45.0639, 168.4635], [-45.0532, 168.4565], [-45.0355, 168.4504], [-45.0242, 168.4397], [-45.0074, 168.4442], [-44.9899, 168.4315], [-44.9714, 168.4373], [-44.9529, 168.4372], [-44.9325, 168.4265], [-44.9229, 168.4256], [-44.9156, 168.4196], [-44.9076, 168.4188], [-44.902, 168.4093], [-44.8941, 168.4033], [-44.8782, 168.3998], [-44.8698, 168.4034], [-44.8612, 168.4034], [-44.8575, 168.3925], [-44.8506, 168.3883]]}], "stops": [{"name": "Окленд", "lat": -36.8485, "lon": 174.7633}, {"name": "Роторуа", "lat": -38.1368, "lon": 176.2497}, {"name": "Напиер", "lat": -39.4928, "lon": 176.912}, {"name": "Таупо", "lat": -38.6857, "lon": 176.0702}, {"name": "Квинстаун", "lat": -45.0312, "lon": 168.6626}, {"name": "Ванака", "lat": -44.7032, "lon": 169.1321}, {"name": "Маунт-Кук", "lat": -43.734, "lon": 170.096}, {"name": "Текапо", "lat": -44.0047, "lon": 170.4771}, {"name": "Те-Анау", "lat": -45.4145, "lon": 167.718}, {"name": "Манапоури", "lat": -45.564, "lon": 167.615}, {"name": "Гленорчи", "lat": -44.8507, "lon": 168.388}], "regionColors": {"Уаихеке": "#b5838d", "Окленд: Кумеу и Клеведон": "#e5989b", "Хокс-Бей": "#9c6644", "Гисборн": "#d4a373", "Мартинборо и Вайрарапа": "#6d597a", "Мальборо": "#90a955", "Нельсон": "#4f772d", "Северный Кентербери": "#457b9d", "Вайтаки": "#a8dadc", "Центральное Отаго": "#7b2d26"}};
const TIERS = [["обязательно", "#7b1e2b"], ["очень ценно", "#c0703a"], ["хорошо", "#6a8d45"], ["можно пропустить", "#9a9a9a"]];
const esc = s => String(s || "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const br = s => esc(s).replace(/\n/g, "<br>");
const dayOf = p => { const m = /День (\d+)/.exec(p || ""); return m ? m[1] : ""; };

const map = L.map("map", { zoomSnap: 0.5, attributionControl: false });
// подложка Esri Light Gray: без ключа и без Referer (CARTO с file:// просит ключ)
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
  attribution: "Tiles &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors", maxZoom: 16
}).addTo(map);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 16, pane: "overlayPane", opacity: 0.8
}).addTo(map);

const layers = { plan: L.layerGroup(), ours: L.layerGroup(), new: L.layerGroup(), bar: L.layerGroup(), route: L.layerGroup(), regions: L.layerGroup() };

// регионы
const labeled = new Set();
DATA.regions.forEach(r => {
  const poly = L.polygon(r.poly, { color: r.color, weight: 1.5, fillColor: r.color, fillOpacity: 0.18, interactive: false });
  poly.addTo(layers.regions);
  if (!labeled.has(r.region)) {
    labeled.add(r.region);
    const b = poly.getBounds();
    L.tooltip({ permanent: true, direction: "top", className: "regl", offset: [0, -4] })
      .setLatLng([b.getNorth(), b.getCenter().lng]).setContent(r.region).addTo(layers.regions);
  }
});

// маршрут
DATA.legs.forEach(l => {
  L.polyline(l.path, { color: "#555", weight: 3, opacity: 0.55 }).bindTooltip(esc(l.label), { sticky: true }).addTo(layers.route);
});
const AKL = DATA.stops.find(s => s.name === "Окленд"), ZQN = DATA.stops.find(s => s.name === "Квинстаун");
L.polyline([[AKL.lat, AKL.lon], [ZQN.lat, ZQN.lon]], { color: "#555", weight: 2, opacity: 0.45, dashArray: "6 8" })
  .bindTooltip("Перелёт Окленд → Квинстаун (день 9) и обратно (последний день)", { sticky: true }).addTo(layers.route);
DATA.stops.forEach(s => {
  L.marker([s.lat, s.lon], { icon: L.divIcon({ className: "", html: '<div class="stop"></div>', iconSize: [10, 10] }), interactive: false })
    .bindTooltip(s.name, { permanent: true, direction: "right", className: "stopl", offset: [6, 0] }).addTo(layers.route);
});

// винодельни
const markers = {};
DATA.wineries.forEach(w => {
  const d = dayOf(w.plan);
  const html = w.status === "plan"
    ? `<div class="mk plan" style="background:${w.tierColor}">${d}</div>`
    : `<div class="mk ${w.status}" style="background:${w.tierColor}"></div>`;
  const size = w.status === "plan" ? 22 : 16;
  const m = L.marker([w.lat, w.lon], { icon: L.divIcon({ className: "", html, iconSize: [size, size] }), zIndexOffset: w.status === "plan" ? 1000 : 0 });
  const site = w.site ? `<a href="${esc(w.site)}" target="_blank" rel="noopener">${esc(w.site.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, ""))}</a>` : "";
  m.bindPopup(`<div class="pop">
    ${w.photo ? `<div class="ph"><img src="${esc(w.photo.src)}" alt=""><a class="cr" href="${esc(w.photo.page)}" target="_blank" rel="noopener">фото: ${esc(w.photo.credit)}</a></div>` : `<div class="ph none">фото не нашёл</div>`}
    <h4>${esc(w.name)}</h4>
    <div class="meta">${esc(w.region)} · ${site}</div>
    <div><span class="tag" style="background:${w.tierColor}">${esc(w.tier)}</span>${w.status === "new" ? '<span class="tag" style="background:#d4a017">не было в разборе</span>' : ""}</div>
    ${w.approx ? `<p style="color:#a0522d">⚠ ${esc(w.approx)}</p>` : ""}
    <p><b>Рейтинг:</b><br>${br(w.rating)}</p>
    <p><b>В программе:</b> ${esc(w.plan)}</p>
    <p><b>Как вышли:</b> ${esc(w.origin)}</p>
    ${w.somm ? `<p><b>Совет:</b> ${esc(w.somm)}</p>` : ""}
    <p><b>Ради чего:</b> ${br(w.why)}</p>
    <p><b>Вина:</b> ${br(w.wines)}</p>
    <p><b>Посещение:</b> ${br(w.visit)}</p>
  </div>`, { maxWidth: 360, maxHeight: 380 });
  m.bindTooltip(esc(w.name), { direction: "top", offset: [0, -8] });
  m.addTo(layers[w.status]);
  markers[w.name] = m;
});
DATA.bars.forEach(b => {
  L.marker([b.lat, b.lon], { icon: L.divIcon({ className: "", html: '<div class="mk bar"></div>', iconSize: [12, 12] }) })
    .bindPopup(`<div class="pop"><h4>${esc(b.name)}</h4><div class="meta">${b.site ? `<a href="${esc(b.site)}" target="_blank" rel="noopener">${esc(b.site)}</a>` : ""}</div><p>${br(b.why)}</p></div>`, { maxWidth: 320 })
    .bindTooltip(esc(b.name), { direction: "top" }).addTo(layers.bar);
});

Object.values(layers).forEach(l => l.addTo(map));
document.querySelectorAll("[data-f]").forEach(cb => cb.addEventListener("change", () => {
  const l = layers[cb.dataset.f];
  cb.checked ? l.addTo(map) : map.removeLayer(l);
}));

// легенда
document.getElementById("legend").innerHTML =
  "<b>Цвет маркера = уровень</b>" +
  TIERS.map(([t, c]) => `<div class="row"><span class="sw" style="background:${c}"></span>${t}</div>`).join("") +
  `<div class="row" style="margin-top:6px"><span class="dot" style="background:#999;box-shadow:0 0 0 3px var(--plan)"></span>в программе, внутри номер дня</div>
   <div class="row"><span class="dot" style="background:#999"></span>рассматривали, не в программе</div>
   <div class="row"><span class="dia" style="background:#999;box-shadow:0 0 0 2px #d4a017"></span>не попали в разбор</div>
   <div class="row"><span class="sw" style="background:#333;width:10px;height:10px"></span>бар или магазин, где наливают</div>`;

// список
const byReg = {};
DATA.wineries.forEach(w => (byReg[w.region] = byReg[w.region] || []).push(w));
const order = Object.keys(DATA.regionColors);
const rank = { plan: 0, ours: 1, new: 2 };
document.getElementById("list").innerHTML = order.filter(r => byReg[r]).map(r =>
  `<div class="reg"><h3><span class="sw" style="background:${DATA.regionColors[r]}"></span>${esc(r)}</h3>` +
  byReg[r].sort((a, b) => rank[a.status] - rank[b.status]).map(w =>
    `<div class="item" data-n="${esc(w.name)}">${w.status === "new" ? `<span class="dia" style="background:${w.tierColor}"></span>` : `<span class="dot" style="background:${w.tierColor}"></span>`}${esc(w.name)}` +
    (w.status === "plan" ? `<span class="d">день ${dayOf(w.plan)}</span>` : w.status === "new" ? `<span class="n">новое</span>` : "") + `</div>`
  ).join("") + "</div>").join("") +
  (DATA.nopoint.length ? `<div class="reg"><h3>Без точки на карте</h3>` + DATA.nopoint.map(n =>
    `<div class="item" style="cursor:default;display:block"><b>${esc(n.name)}</b> <span style="color:var(--muted)">${esc(n.region)}. ${esc(n.why)}</span></div>`).join("") + "</div>" : "");
document.querySelectorAll(".item[data-n]").forEach(el => el.addEventListener("click", () => {
  const m = markers[el.dataset.n];
  if (!m) return;
  map.flyTo(m.getLatLng(), 11, { duration: 0.8 });
  setTimeout(() => m.openPopup(), 850);
}));

// подписи городов маршрута только при приближении, иначе спорят с названиями регионов
const syncStops = () => document.body.classList.toggle("far", map.getZoom() < 7);
map.on("zoomend", syncStops);

const all = DATA.wineries.map(w => [w.lat, w.lon]).concat(DATA.stops.map(s => [s.lat, s.lon]));
map.fitBounds(all, { padding: [20, 20] });
syncStops();
</script>
</body>
</html>
